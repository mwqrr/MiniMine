name: "🔨 Compilação MiniMine"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # ═══════════════════════════════════════
  #  PC — JAR executável (Linux/Windows)
  # ═══════════════════════════════════════
  pc:
    name: "🖥️ PC (JAR)"
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checagem do código
        uses: actions/checkout@v4

      - name: ☕ Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🔑 Dar permissão ao Gradle
        run: chmod +x gradlew

      - name: 🔨 Compilar JAR
        run: ./gradlew gdx-pc:jar --no-daemon -Dorg.gradle.entrypoint.warn.implicit.dependency=false

      - name: 📦 Guardar JAR
        uses: actions/upload-artifact@v4
        with:
          name: MiniMine-PC
          path: gdx-pc/build/libs/*.jar

  # ═══════════════════════════════════════
  #  Android — APK debug
  # ═══════════════════════════════════════
  android:
    name: "📱 Android (APK)"
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checagem do código
        uses: actions/checkout@v4

      - name: ☕ Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🔑 Dar permissão ao Gradle
        run: chmod +x gradlew

      - name: 🔨 Compilar APK
        run: ./gradlew gdx-android:assembleDebug --no-daemon -Pandroid.suppressUnsupportedCompileSdk=34 -Pcom.android.tools.build.gradle.overrideVersionCheck=true

      - name: 📦 Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: MiniMine-Android
          path: gdx-android/build/outputs/apk/debug/*.apk
